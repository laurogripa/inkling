<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkling 2 Mini experiments</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: linear-gradient(180deg, #dfeeff 0%, #f4fafd 100%);
    color: #1f2937;
  }
  main { text-align: center; width: 100%; max-width: 520px; }
  h1 { font-size: clamp(2rem, 6vw, 2.6rem); letter-spacing: -0.03em; margin: 0 0 4px; }
  nav a {
    display: block;
    text-decoration: none;
    background: #ffffff;
    border: 1px solid rgba(15, 23, 42, 0.07);
    border-radius: 16px;
    padding: 1.1rem 1.25rem;
    margin: .7rem auto 0;
    box-shadow: 0 12px 30px -18px rgba(15, 23, 42, 0.35);
    transition: transform .15s ease;
  }
  nav a:hover { transform: translateY(-2px); }
  nav a strong { display: block; font-size: 1.15rem; color: #1f2937; }
</style>
</head>
<body>
<main>
  <h1>Inkling 2 Mini experiments</h1>
  <nav>
    <a href="pelican-bike/"><strong>Pelican on a Bike</strong></a>
    <a href="pagoda/"><strong>Pagoda</strong></a>
  </nav>
</main>
</body>
</html>
